<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dugout · Airy prototype</title>
<style>
:root{
  --bg:#faf7f2;--surface:#ffffff;--soft:#f3eee6;--fg:#26222e;--muted:#625b6e;--line:#e6dfd3;--focus:#5b3fd1;--accent:#5b3fd1;
  --passed:#14703f;--needs_review:#8f5200;--failed:#b4232c;--interrupted:#4f5868;--unreadable:#7a2fa8;
  --passed-bg:#dcf2e3;--needs_review-bg:#fdebcc;--failed-bg:#fbdedf;--interrupted-bg:#e4e8ee;--unreadable-bg:#efe0fa;
  --dot-passed:#2fa566;--dot-needs_review:#e29a1f;--dot-failed:#dc4a52;--dot-interrupted:#8a94a6;
  --shadow:0 1px 2px rgba(60,40,20,.05),0 8px 24px -12px rgba(60,40,20,.18);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16141d;--surface:#1f1c29;--soft:#262233;--fg:#ece8f4;--muted:#a79fb8;--line:#332e43;--focus:#b9a6ff;--accent:#b9a6ff;
  --passed:#6fdc9c;--needs_review:#f5c36b;--failed:#ff9aa0;--interrupted:#b4bdcc;--unreadable:#d9a8ff;
  --passed-bg:#173325;--needs_review-bg:#3a2d12;--failed-bg:#3d1b1f;--interrupted-bg:#2b3039;--unreadable-bg:#32204a;
  --dot-passed:#4cc585;--dot-needs_review:#e8ac3d;--dot-failed:#ef6b73;--dot-interrupted:#8e98aa;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#16141d;--surface:#1f1c29;--soft:#262233;--fg:#ece8f4;--muted:#a79fb8;--line:#332e43;--focus:#b9a6ff;--accent:#b9a6ff;
  --passed:#6fdc9c;--needs_review:#f5c36b;--failed:#ff9aa0;--interrupted:#b4bdcc;--unreadable:#d9a8ff;
  --passed-bg:#173325;--needs_review-bg:#3a2d12;--failed-bg:#3d1b1f;--interrupted-bg:#2b3039;--unreadable-bg:#32204a;
  --dot-passed:#4cc585;--dot-needs_review:#e8ac3d;--dot-failed:#ef6b73;--dot-interrupted:#8e98aa;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 ui-rounded,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:12px}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:20px;padding:18px 24px;max-width:1120px;margin:0 auto;flex-wrap:wrap}
.brand{font-size:20px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand svg{width:26px;height:26px}
.top nav{display:flex;gap:6px;flex:1}
.top nav a{padding:6px 16px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:600;font-size:15px}
.top nav a[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.theme{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;font-size:14px}
main{max-width:1120px;margin:0 auto;padding:8px 24px 72px;outline:none}
h1{font-size:34px;line-height:1.2;letter-spacing:-.02em;margin:8px 0 6px}
h2{font-size:22px;letter-spacing:-.01em;margin:44px 0 16px}
.lede{color:var(--muted);margin:0 0 28px;max-width:60ch}
.muted{color:var(--muted)}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.85em}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 12px 2px 8px;font-size:14px;font-weight:700;white-space:nowrap}
.pill i{font-style:normal;width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;background:currentColor}
.pill i b{color:var(--surface);font-weight:800}
.pill.passed{background:var(--passed-bg);color:var(--passed)}.pill.needs_review{background:var(--needs_review-bg);color:var(--needs_review)}.pill.failed{background:var(--failed-bg);color:var(--failed)}.pill.interrupted{background:var(--interrupted-bg);color:var(--interrupted)}.pill.unreadable{background:var(--unreadable-bg);color:var(--unreadable)}
.pill span{color:var(--fg)}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.seg .lab{width:100%;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;margin-top:22px}
a.card{display:flex;flex-direction:column;gap:14px;background:var(--surface);border-radius:20px;padding:22px;text-decoration:none;color:var(--fg);box-shadow:var(--shadow);border:1px solid var(--line);transition:transform .15s}
a.card:hover{transform:translateY(-2px)}
a.card:focus-visible{outline-offset:4px}
.card .r1{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h3{margin:0;font-size:19px;line-height:1.35;font-weight:650;letter-spacing:-.005em}
.card .id{color:var(--muted)}
.dots{display:flex;align-items:center;gap:6px}
.dots svg{display:block}
.card .foot{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:14.5px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.card .foot b{color:var(--fg);font-weight:650}
.empty{padding:48px 24px;text-align:center;color:var(--muted);background:var(--surface);border-radius:20px;border:1px dashed var(--line)}
.back{display:inline-block;margin:6px 0 14px;color:var(--muted);text-decoration:none;font-weight:600}
.back:hover{color:var(--fg)}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:32px;box-shadow:var(--shadow)}
.hero h1{font-size:30px;margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:18px;margin-top:26px}
.stats div{background:var(--soft);border-radius:16px;padding:14px 16px}
.stats dt{font-size:13px;color:var(--muted);font-weight:600}
.stats dd{margin:2px 0 0;font-size:20px;font-weight:700;overflow-wrap:anywhere}
.steps{display:flex;gap:0;overflow-x:auto;padding:12px 4px 22px;scroll-snap-type:x proximity;margin:0;list-style:none}
.step{flex:0 0 190px;scroll-snap-align:start;position:relative;padding-right:14px}
.step::before{content:"";position:absolute;top:18px;left:18px;right:-4px;height:3px;background:var(--line)}
.step:last-child::before{right:auto;width:0}
.step .node{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;color:var(--surface);border:3px solid var(--bg)}
.step.ok .node{background:var(--passed)}.step.bad .node{background:var(--failed)}.step.warn .node{background:var(--needs_review)}.step.info .node{background:var(--accent)}.step.mute .node{background:var(--muted)}
.step .at{margin-top:10px;font-size:13px;color:var(--muted)}
.step .lab{font-weight:700;line-height:1.3}
.step .tx{font-size:14px;color:var(--muted);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow);margin-bottom:18px}
.attgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.panel h3{margin:0 0 6px;font-size:18px}
.row2{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--muted);font-size:15px;margin:8px 0}
.row2 b{color:var(--fg)}
pre{margin:12px 0 0;padding:14px 16px;background:var(--soft);border-radius:14px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace}
details{margin-top:12px}
summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:15px}
details ul{margin:8px 0 0;padding-left:20px;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.issue{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.sev{flex:0 0 74px;text-align:center;border-radius:10px;padding:2px 0;font-size:13px;font-weight:800;height:fit-content;text-transform:uppercase;letter-spacing:.04em}
.sev.hi{background:var(--failed-bg);color:var(--failed)}.sev.mid{background:var(--needs_review-bg);color:var(--needs_review)}.sev.lo{background:var(--interrupted-bg);color:var(--interrupted)}
.issue .loc{color:var(--muted);overflow-wrap:anywhere}
.placeholder{border:2px dashed var(--line);border-radius:22px;padding:48px 24px;text-align:center;color:var(--muted);background:var(--soft)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px}
.sc h3{margin:0;font-size:20px}
.sc .figs{display:flex;gap:20px;align-items:center;margin:16px 0}
.sc .big{font-size:38px;font-weight:750;letter-spacing:-.02em;line-height:1}
.sc .mini{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:14px 0}
.sc .mini div{font-size:14px;color:var(--muted)}
.sc .mini b{display:block;color:var(--fg);font-size:18px}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.barlab{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin:10px 0 4px}
.sev-stack .bar{height:16px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:14px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--c)}
.note{color:var(--muted);margin-top:26px;font-size:15px}
.kbd{border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:13px;background:var(--surface)}
@media (max-width:640px){
  body{font-size:16px}
  .top{padding:14px 16px;gap:12px}
  main{padding:4px 16px 56px}
  h1{font-size:28px}
  .cards,.attgrid,.sgrid{grid-template-columns:minmax(0,1fr)}
  .hero{padding:22px 18px;border-radius:22px}
  .panel{padding:18px}
  .step{flex-basis:160px}
  .issue{flex-direction:column;gap:6px}
  .sev{flex-basis:auto;width:84px}
}
</style>
</head>

<script>
globalThis.Board = (() => {
  const DATA = JSON.parse(document.getElementById("board-data").textContent);
  const STATUS = {
    passed: { label: "Passed", icon: "✓" },
    needs_review: { label: "Needs review", icon: "!" },
    failed: { label: "Failed", icon: "✕" },
    interrupted: { label: "Interrupted", icon: "…" },
    unreadable: { label: "Unreadable", icon: "?" },
  };
  const STATUS_ORDER = ["passed", "needs_review", "failed", "interrupted", "unreadable"];
  const state = { status: "all", provider: "all" };
  let views = null;

  const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  const ms = (value) => {
    if (value === null || value === undefined) return "—";
    if (value < 1000) return Math.round(value) + "ms";
    const s = value / 1000;
    if (s < 60) return (s < 10 ? s.toFixed(1) : Math.round(s)) + "s";
    const m = Math.floor(s / 60);
    const rest = Math.round(s - m * 60);
    if (m < 60) return m + "m " + String(rest).padStart(2, "0") + "s";
    return Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m";
  };
  const num = (value) => {
    if (value >= 10000) return (value / 1000).toFixed(1).replace(/\.0$/, "") + "k";
    return value.toLocaleString("en-US");
  };
  const tokens = (t) => ({ input: num(t.input), output: num(t.output), total: num(t.input + t.output) });
  const pct = (value) => Math.round(value * 100) + "%";
  const dec = (value) => (Math.round(value * 100) / 100).toString();
  const date = (iso) => (iso ? iso.slice(0, 10) : "—");
  const dateTime = (iso) => (iso ? iso.slice(0, 10) + " " + iso.slice(11, 16) + " UTC" : "—");
  const offset = (iso, start) => {
    const d = Date.parse(iso) - Date.parse(start);
    if (!(d >= 0)) return "+0s";
    if (d < 1000) return "+" + Math.round(d) + "ms";
    return "+" + ms(d).replace(/ /g, "");
  };

  const allTasks = () => DATA.tasks;
  const findTask = (id) => DATA.tasks.find((t) => t.summary.taskId === id);
  const providersAll = () => [...new Set(DATA.tasks.flatMap((t) => t.summary.providers))].sort();
  const statusCounts = () => {
    const counts = { all: DATA.tasks.length };
    for (const s of STATUS_ORDER) counts[s] = DATA.tasks.filter((t) => t.summary.status === s).length;
    return counts;
  };
  const filtered = () => DATA.tasks.filter((t) =>
    (state.status === "all" || t.summary.status === state.status) &&
    (state.provider === "all" || t.summary.providers.includes(state.provider)));

  const attemptsOf = (events) => {
    const list = [];
    const byN = new Map();
    for (const e of events) {
      if (e.type === "attempt.started") {
        const a = { n: e.attempt, provider: e.provider, model: e.model, reason: e.reason, status: null,
          exitReason: null, durationMs: null, input: 0, output: 0, verify: null, tools: [], messages: [], startTs: e.ts };
        byN.set(e.attempt, a);
        list.push(a);
      } else if ("attempt" in e && byN.has(e.attempt)) {
        const a = byN.get(e.attempt);
        if (e.type === "attempt.finished") { a.status = e.status; a.exitReason = e.exitReason; a.durationMs = e.durationMs; }
        else if (e.type === "provider.usage") { a.input += e.inputTokens ?? 0; a.output += e.outputTokens ?? 0; }
        else if (e.type === "verify.started") a.verify = { command: e.command, passed: null, exitCode: null, durationMs: null, outputTail: "" };
        else if (e.type === "verify.finished") a.verify = { ...(a.verify ?? { command: "" }), passed: e.passed, exitCode: e.exitCode, durationMs: e.durationMs, outputTail: e.outputTail };
        else if (e.type === "provider.tool") a.tools.push(e);
        else if (e.type === "provider.message") a.messages.push(e);
      }
    }
    return list;
  };
  const reviewOf = (events) => events.findLast((e) => e.type === "review.finished") ?? null;
  const setupOf = (events) => events.find((e) => e.type === "setup.finished") ?? null;
  const finishOf = (events) => events.findLast((e) => e.type === "task.finished") ?? null;

  const describe = (e, start) => {
    const at = offset(e.ts, start);
    const base = { at, type: e.type, attempt: e.attempt ?? null };
    switch (e.type) {
      case "task.created": return { ...base, label: "Task created", text: e.package.goal, tone: "info" };
      case "worktree.created": return { ...base, label: "Worktree", text: e.branch + " from " + e.baseRef, tone: "mute" };
      case "setup.finished": return { ...base, label: "Setup " + (e.passed ? "passed" : "failed"), text: "exit " + e.exitCode + " in " + ms(e.durationMs) + (e.outputTail ? " · " + e.outputTail : ""), tone: e.passed ? "ok" : "bad" };
      case "attempt.started": return { ...base, label: "Attempt " + e.attempt + " started", text: e.provider + " · " + e.model + " · " + e.reason, tone: "info" };
      case "provider.tool": return { ...base, label: "Tool " + e.name, text: e.summary, tone: "mute" };
      case "provider.message": return { ...base, label: "Message", text: e.text, tone: "mute" };
      case "provider.usage": return { ...base, label: "Usage", text: num(e.inputTokens ?? 0) + " in / " + num(e.outputTokens ?? 0) + " out", tone: "mute" };
      case "attempt.finished": return { ...base, label: "Attempt " + e.attempt + " " + e.status, text: e.exitReason + " · " + ms(e.durationMs), tone: e.status === "completed" ? "ok" : "bad" };
      case "fallback.triggered": return { ...base, label: "Fallback", text: e.from + " → " + e.to + " (" + e.reason + ")", tone: "warn" };
      case "verify.started": return { ...base, label: "Verify started", text: e.command, tone: "mute" };
      case "verify.finished": return { ...base, label: "Verify " + (e.passed ? "passed" : "failed"), text: "exit " + e.exitCode + " in " + ms(e.durationMs), tone: e.passed ? "ok" : "bad" };
      case "review.started": return { ...base, label: "Review started", text: e.provider + " · " + e.model, tone: "info" };
      case "review.finished": return { ...base, label: "Review " + e.result.verdict.replace("_", " "), text: e.result.issues.length + " issue" + (e.result.issues.length === 1 ? "" : "s"), tone: e.result.verdict === "approve" ? "ok" : "warn" };
      case "task.finished": return { ...base, label: "Task " + e.status.replace("_", " "), text: e.attempts + " attempt" + (e.attempts === 1 ? "" : "s") + " · " + e.diffStat.files + " files +" + e.diffStat.additions + " −" + e.diffStat.deletions + " · " + ms(e.durationMs), tone: e.status === "passed" ? "ok" : e.status === "failed" ? "bad" : "warn" };
      default: return { ...base, label: e.type, text: "", tone: "mute" };
    }
  };

  const route = () => {
    const h = location.hash.replace(/^#/, "") || "/";
    if (h === "/scorecard") return { name: "scorecard" };
    const m = /^\/tasks\/([A-Za-z0-9][A-Za-z0-9_-]*)$/.exec(h);
    if (m) return { name: "detail", id: m[1] };
    return { name: "list" };
  };

  const setTheme = (theme) => {
    document.documentElement.dataset.theme = theme;
    try { localStorage.setItem("dugout-proto-theme", theme); } catch { /* storage may be blocked */ }
    syncToggle();
  };
  const effectiveTheme = () => document.documentElement.dataset.theme ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const syncToggle = () => {
    const t = effectiveTheme();
    for (const b of document.querySelectorAll("[data-theme-toggle]")) {
      b.textContent = t === "dark" ? "Light theme" : "Dark theme";
      b.setAttribute("aria-label", "Switch to " + (t === "dark" ? "light" : "dark") + " theme");
    }
  };

  const render = (focusSel) => {
    const r = route();
    const app = document.getElementById("app");
    let html;
    let title = "Board";
    if (r.name === "detail") {
      const task = findTask(r.id);
      html = task ? views.detail(task) : views.missing(r.id);
      title = r.id;
    } else if (r.name === "scorecard") { html = views.scorecard(DATA.scorecard); title = "Scorecard"; }
    else html = views.list();
    app.innerHTML = html;
    document.title = title + " · Dugout";
    for (const a of document.querySelectorAll("[data-nav]")) {
      const on = (a.dataset.nav === "scorecard") === (r.name === "scorecard");
      if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    }
    syncToggle();
    if (focusSel) { const el = app.querySelector(focusSel); if (el) el.focus(); }
    else if (r.name !== "list" || state.fromRoute) { window.scrollTo(0, 0); app.focus({ preventScroll: true }); }
    state.fromRoute = true;
  };

  const rows = () => [...document.querySelectorAll("[data-row]")];
  const onKey = (ev) => {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    const tag = ev.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") { if (ev.key === "Escape") ev.target.blur(); return; }
    const r = route();
    if (ev.key === "Escape") {
      if (r.name !== "list") { location.hash = "#/"; ev.preventDefault(); }
      return;
    }
    if (r.name !== "list") return;
    const list = rows();
    if (!list.length) return;
    const i = list.indexOf(document.activeElement);
    if (ev.key === "j" || ev.key === "ArrowDown") { list[Math.min(i + 1, list.length - 1)].focus(); ev.preventDefault(); }
    else if (ev.key === "k" || ev.key === "ArrowUp") { list[Math.max(i - 1, 0)].focus(); ev.preventDefault(); }
    else if (ev.key === "Enter" && i < 0) { list[0].click(); ev.preventDefault(); }
  };

  const onClick = (ev) => {
    const t = ev.target.closest("[data-theme-toggle], [data-set-status], [data-set-provider]");
    if (!t) return;
    if (t.hasAttribute("data-theme-toggle")) { setTheme(effectiveTheme() === "dark" ? "light" : "dark"); return; }
    if (t.dataset.setStatus !== undefined) state.status = t.dataset.setStatus;
    if (t.dataset.setProvider !== undefined) state.provider = t.dataset.setProvider;
    const sel = t.dataset.setStatus !== undefined ? '[data-set-status="' + t.dataset.setStatus + '"]' : '[data-set-provider="' + t.dataset.setProvider + '"]';
    render(sel);
  };

  const start = (v) => {
    views = v;
    try {
      const saved = localStorage.getItem("dugout-proto-theme");
      if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
    } catch { /* storage may be blocked */ }
    document.addEventListener("keydown", onKey);
    document.addEventListener("click", onClick);
    addEventListener("hashchange", () => render());
    render();
  };

  return { STATUS, STATUS_ORDER, state, esc, ms, num, tokens, pct, dec, date, dateTime, offset, allTasks, findTask,
    providersAll, statusCounts, filtered, attemptsOf, reviewOf, setupOf, finishOf, describe, start };
})();

</script>
<script>
(() => {
  const B = Board;
  const e = B.esc;
  const pill = (s) => '<span class="pill ' + s + '"><i aria-hidden="true"><b>' + B.STATUS[s].icon + "</b></i><span>" + B.STATUS[s].label + "</span></span>";
  const dotColor = (a) => a.status !== "completed" ? "failed" : a.verify && a.verify.passed === false ? "failed" : "passed";
  const dotsSvg = (events) => {

    if (!atts.length) return '<span class="muted">no attempts</span>';
    const w = atts.length * 26;
    const circles = atts.map((a, i) => {
      const c = dotColor(a);
      const mark = c === "passed" ? "M-4 0l3 3 5-6" : "M-4 -4l8 8M4 -4l-8 8";
      return '<g transform="translate(' + (13 + i * 26) + ' 13)"><circle r="11" fill="var(--dot-' + c + ')"/><path d="' + mark + '" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>';
    }).join("");
    const label = atts.map((a) => "attempt " + a.n + " " + a.provider + " " + (dotColor(a) === "passed" ? "ok" : "failed")).join(", ");
    return '<svg width="' + w + '" height="26" viewBox="0 0 ' + w + ' 26" role="img" aria-label="' + e(label) + '"><title>' + e(label) + "</title>" + circles + "</svg>";
  };
  const seg = (attr, lab, items, current) => '<div class="seg" role="group" aria-label="' + e(lab) + '"><div class="lab">' + e(lab) + "</div>" +
    items.map(([v, text]) => '<button type="button" ' + attr + '="' + e(v) + '" aria-pressed="' + (current === v) + '">' + e(text) + "</button>").join("") + "</div>";

  const list = () => {
    const counts = B.statusCounts();
    const items = B.filtered();
    const cards = items.map(({ summary: s, events }) => {
      if (s.status === "unreadable") {
        return '<a class="card" data-row href="#/tasks/' + e(s.taskId) + '"><div class="r1">' + pill(s.status) + '</div><h3 class="mono">' + e(s.taskId) + '</h3><p class="muted" style="margin:0">' + e(s.reason) + "</p></a>";
      }
      const t = B.tokens(s.tokens);
      const max = Math.max(1, s.tokens.input + s.tokens.output);
      return '<a class="card" data-row href="#/tasks/' + e(s.taskId) + '"><div class="r1">' + pill(s.status) + '<span class="muted">' + B.date(s.startedAt) + "</span></div>" +
        "<h3>" + e(s.goal) + '</h3><div class="id mono">' + e(s.taskId) + "</div>" +
        '<div class="dots">' + dotsSvg(events) + '<span class="muted">' + s.attempts + (s.attempts === 1 ? " attempt" : " attempts") + "</span></div>" +
        '<div class="bar" role="img" aria-label="' + t.input + " input, " + t.output + ' output tokens"><span style="width:' + (s.tokens.input / max * 100) + '%;background:var(--accent)"></span><span style="width:' + (s.tokens.output / max * 100) + '%;background:var(--dot-needs_review)"></span></div>' +
        '<div class="foot"><span><b>' + e(s.providers.join(" → ") || "none") + "</b></span><span><b>" + B.ms(s.durationMs) + "</b> total</span><span><b>" + t.total + "</b> tokens</span></div></a>";
    }).join("");
    return "<h1>Recent work</h1><p class=\"lede\">" + items.length + " of " + counts.all + ' tasks. Use <span class="kbd">j</span> <span class="kbd">k</span> to move, <span class="kbd">Enter</span> to open.</p>' +
      seg("data-set-status", "Status", [["all", "All " + counts.all], ...B.STATUS_ORDER.filter((s) => counts[s] > 0).map((s) => [s, B.STATUS[s].label + " " + counts[s]])], B.state.status) +
      seg("data-set-provider", "Provider", [["all", "Any"], ...B.providersAll().map((p) => [p, p])], B.state.provider) +
      '<div class="cards">' + (cards || '<div class="empty">No tasks match these filters.</div>') + "</div>" +
      '<p class="note">Dots show each attempt (check = completed and verified, cross = failed). The bar splits input and output tokens.</p>';
  };

  const stepper = (events) => {
    const start = events[0].ts;
    const skip = new Set(["provider.tool", "provider.message", "provider.usage", "verify.started", "review.started", "worktree.created"]);
    const shown = events.filter((x) => !skip.has(x.type));
    const icon = { ok: "✓", bad: "✕", warn: "!", info: "●", mute: "·" };
    return '<ol class="steps" tabindex="0" aria-label="Timeline, scroll sideways">' + shown.map((x) => {
      const d = B.describe(x, start);
      return '<li class="step ' + d.tone + '"><div class="node" aria-hidden="true">' + icon[d.tone] + '</div><div class="at">' + e(d.at) + '</div><div class="lab">' + e(d.label) + '</div><div class="tx" title="' + e(d.text) + '">' + e(d.text) + "</div></li>";
    }).join("") + "</ol>" + '<p class="muted" style="margin:0;font-size:14px">' + (events.length - shown.length) + " lower-level events (tool calls, messages, usage, start markers) are listed inside each attempt.</p>";
  };

  const attemptCard = (a) => {
    const ok = a.status === "completed";
    const v = a.verify;
    const sub = a.tools.map((x) => "<li><b>" + e(x.name) + "</b> " + e(x.summary) + "</li>").concat(a.messages.map((x) => "<li><i>" + e(x.text) + "</i></li>"));
    return '<article class="panel"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><h3>Attempt ' + a.n + " · " + e(a.provider) + '</h3><span class="pill ' + (ok ? "passed" : "failed") + '"><i aria-hidden="true"><b>' + (ok ? "✓" : "✕") + "</b></i><span>" + e(a.exitReason) + "</span></span></div>" +
      '<div class="muted mono">' + e(a.model) + '</div><div class="row2"><span>Reason <b>' + a.reason + "</b></span><span>Took <b>" + B.ms(a.durationMs) + "</b></span><span><b>" + B.num(a.input) + "</b> in</span><span><b>" + B.num(a.output) + "</b> out</span></div>" +
      (v ? '<div class="row2"><span class="pill ' + (v.passed ? "passed" : "failed") + '"><i aria-hidden="true"><b>' + (v.passed ? "✓" : "✕") + "</b></i><span>Verify " + (v.passed ? "passed" : "failed") + '</span></span><span class="mono">' + e(v.command) + "</span><span>exit <b>" + v.exitCode + "</b> · " + B.ms(v.durationMs) + "</span></div>" +
        "<pre>" + (v.outputTail ? e(v.outputTail) : "(no output)") + "</pre>" : '<p class="muted">Verify did not run.</p>') +
      (sub.length ? "<details><summary>" + sub.length + " tool calls and messages</summary><ul>" + sub.join("") + "</ul></details>" : "") + "</article>";
  };

  const detail = (task) => {
    const s = task.summary;
    const ev = task.events;
    if (s.status === "unreadable") {
      return '<a class="back" href="#/">&larr; All tasks</a><div class="hero">' + pill(s.status) + '<h1 class="mono">' + e(s.taskId) + '</h1><p class="muted">This log could not be read: ' + e(s.reason) + "</p></div>";
    }
    const atts = B.attemptsOf(ev);
    const setup = B.setupOf(ev);
    const rev = B.reviewOf(ev);
    const fin = B.finishOf(ev);
    const t = B.tokens(s.tokens);
    const sevClass = (x) => (x === "blocker" || x === "major" ? "hi" : x === "minor" ? "mid" : "lo");
    const issues = rev ? rev.result.issues.map((i) => '<div class="issue"><span class="sev ' + sevClass(i.severity) + '">' + i.severity + '</span><div>' + e(i.message) + '<div class="loc mono">' + e(i.file) + (i.line ? ":" + i.line : "") + "</div></div></div>").join("") : "";
    const review = rev ? '<div class="panel"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span class="pill ' + (rev.result.verdict === "approve" ? "passed" : "needs_review") + '"><i aria-hidden="true"><b>' + (rev.result.verdict === "approve" ? "✓" : "!") + "</b></i><span>" + e(rev.result.verdict.replace("_", " ")) + '</span></span><span class="muted">reviewed by ' + e(rev.provider) + " · " + e(rev.model) + "</span></div><p>" + e(rev.result.summary) + "</p>" + (issues || '<p class="muted" style="margin:0">No issues reported.</p>') + "</div>" : '<div class="panel muted">No review in this log.</div>';
    return '<a class="back" href="#/">&larr; All tasks <span class="kbd">Esc</span></a>' +
      '<div class="hero">' + pill(s.status) + "<h1>" + e(s.goal) + '</h1><div class="muted mono">' + e(s.taskId) + "</div>" +
      '<dl class="stats" style="margin-bottom:0"><div><dt>Started</dt><dd>' + B.date(s.startedAt) + "</dd></div><div><dt>Duration</dt><dd>" + B.ms(s.durationMs) + "</dd></div><div><dt>Attempts</dt><dd>" + s.attempts + '</dd></div><div><dt>Providers</dt><dd style="font-size:17px">' + e(s.providers.join(" → ") || "none") + "</dd></div><div><dt>Tokens in / out</dt><dd>" + t.input + " / " + t.output + "</dd></div>" +
      (fin ? "<div><dt>Diff</dt><dd>" + fin.diffStat.files + " files <span style=\"font-size:15px\" class=\"muted\">+" + fin.diffStat.additions + " −" + fin.diffStat.deletions + "</span></dd></div>" : "") + "</dl></div>" +
      "<h2>Timeline</h2>" + stepper(ev) +
      "<h2>Attempts</h2>" + (setup && !setup.passed ? '<div class="panel"><span class="pill failed"><i aria-hidden="true"><b>✕</b></i><span>Setup failed</span></span> <span class="muted">exit ' + setup.exitCode + "</span><pre>" + e(setup.outputTail ?? "") + "</pre></div>" : "") +
      '<div class="attgrid">' + atts.map(attemptCard).join("") + "</div>" +
      "<h2>Review</h2>" + review +
      '<h2>Diff</h2><div class="placeholder">The diff viewer goes here.<br><span class="mono">/api/tasks/' + e(s.taskId) + "/diff</span></div>";
  };

  const scorecard = (sc) => {
    const maxTok = Math.max(1, ...sc.implementers.map((r) => r.inputTokens + r.outputTokens));
    const ring = (rate) => {
      const r = 34, c = 2 * Math.PI * r;
      return '<svg width="84" height="84" viewBox="0 0 84 84" role="img" aria-label="First-try pass rate ' + B.pct(rate) + '"><circle cx="42" cy="42" r="' + r + '" fill="none" stroke="var(--soft)" stroke-width="10"/><circle cx="42" cy="42" r="' + r + '" fill="none" stroke="var(--dot-passed)" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + (c * rate).toFixed(2) + " " + c.toFixed(2) + '" transform="rotate(-90 42 42)"/></svg>';
    };
    const impl = sc.implementers.map((r) => '<article class="panel sc"><h3>' + e(r.provider) + '</h3><div class="muted mono">' + e(r.model) + '</div><div class="figs">' + ring(r.firstTryPassRate) + '<div><div class="big">' + B.pct(r.firstTryPassRate) + '</div><div class="muted">first-try pass rate</div></div></div>' +
      '<div class="mini"><div><b>' + r.tasks + "</b>tasks</div><div><b>" + r.passed + "</b>passed</div><div><b>" + B.dec(r.meanRetries) + "</b>mean retries</div><div><b>" + B.ms(r.meanDurationMs) + "</b>mean time</div></div>" +
      '<div class="barlab"><span>Input ' + B.num(r.inputTokens) + "</span><span>Output " + B.num(r.outputTokens) + '</span></div><div class="bar" role="img" aria-label="' + B.num(r.inputTokens) + " input, " + B.num(r.outputTokens) + ' output tokens"><span style="width:' + (r.inputTokens / maxTok * 100) + '%;background:var(--accent)"></span><span style="width:' + (r.outputTokens / maxTok * 100) + '%;background:var(--dot-needs_review)"></span></div></article>').join("");
    const col = { blocker: "var(--dot-failed)", major: "var(--dot-needs_review)", minor: "var(--accent)", nit: "var(--dot-interrupted)" };
    const rev = sc.reviewers.map((r) => {
      const total = r.blocker + r.major + r.minor + r.nit;
      const segs = ["blocker", "major", "minor", "nit"].map((k) => '<span style="width:' + (total ? r[k] / total * 100 : 0) + "%;background:" + col[k] + '"></span>').join("");
      const legend = ["blocker", "major", "minor", "nit"].map((k) => '<span style="--c:' + col[k] + '">' + k + " <b>" + r[k] + "</b></span>").join("");
      return '<article class="panel sc sev-stack"><h3>' + e(r.provider) + '</h3><div class="muted mono">' + e(r.model) + '</div><div class="figs"><div><div class="big">' + r.reviews + '</div><div class="muted">' + (r.reviews === 1 ? "review" : "reviews") + '</div></div><div><div class="big">' + total + '</div><div class="muted">issues found</div></div></div><div class="bar" role="img" aria-label="' + total + ' issues by severity">' + (total ? segs : "") + '</div><div class="legend">' + legend + "</div></article>";
    }).join("");
    return '<a class="back" href="#/">&larr; All tasks <span class="kbd">Esc</span></a><h1>Scorecard</h1><p class="lede">Finished tasks only. Left out: ' + sc.excluded.interrupted + " interrupted and " + sc.excluded.unreadable + " unreadable logs.</p>" +
      '<h2 style="margin-top:8px">Implementers</h2><div class="sgrid">' + impl + '</div><h2>Reviewers</h2><div class="sgrid">' + rev + "</div>" +
      '<p class="note">First try means passed with exactly one attempt. A sample this small shows the layout, not model quality.</p>';
  };

  const missing = (id) => '<a class="back" href="#/">&larr; All tasks</a><p>No task with id ' + e(id) + ".</p>";
  B.start({ list, detail, scorecard, missing });
})();
</script>
</body>
</html>
